groups:
  - name: pedidos-veloz
    rules:
      - alert: ServicoForaDoAr
        expr: up{job="pedidos-veloz"} == 0
        for: 1m
        labels:
          severidade: critica
        annotations:
          resumo: "Um serviço da Pedidos Veloz está indisponível"
      - alert: TaxaAltaDeErros
        expr: >-
          sum(rate(http_requisicoes_total{status=~"5.."}[5m]))
          / clamp_min(sum(rate(http_requisicoes_total[5m])), 1) > 0.05
        for: 5m
        labels:
          severidade: aviso
        annotations:
          resumo: "Mais de 5% das requisições retornaram erro em cinco minutos"
