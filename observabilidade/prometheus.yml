global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: pedidos-veloz
    metrics_path: /metricas/
    static_configs:
      - targets:
          - gateway:8000
          - pedidos:8001
          - estoque:8002
          - pagamentos:8003
  - job_name: rabbitmq
    static_configs:
      - targets: [rabbitmq:15692]
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
