  BANCO_PEDIDOS_URL: postgresql+psycopg://veloz:TROQUE_ESTA_SENHA@postgres:5432/pedidos
  BANCO_ESTOQUE_URL: postgresql+psycopg://veloz:TROQUE_ESTA_SENHA@postgres:5432/estoque
  BANCO_PAGAMENTOS_URL: postgresql+psycopg://veloz:TROQUE_ESTA_SENHA@postgres:5432/pagamentos
