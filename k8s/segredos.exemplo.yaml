apiVersion: v1
kind: Secret
metadata:
  name: segredos-plataforma
  namespace: pedidos-veloz
type: Opaque
stringData:
  POSTGRES_USUARIO: veloz
  POSTGRES_SENHA: TROQUE_ESTA_SENHA
  RABBITMQ_USUARIO: veloz
  RABBITMQ_SENHA: TROQUE_ESTA_SENHA
