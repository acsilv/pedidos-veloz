apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    componente: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        componente: dados
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16.6-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: segredos-plataforma
                  key: POSTGRES_USUARIO
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: segredos-plataforma
                  key: POSTGRES_SENHA
            - name: POSTGRES_DB
              value: postgres
          volumeMounts:
            - name: dados
              mountPath: /var/lib/postgresql/data
            - name: inicializacao
              mountPath: /docker-entrypoint-initdb.d/10-inicializar-bancos.sh
              subPath: 10-inicializar-bancos.sh
              readOnly: true
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d postgres"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d postgres"]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
      volumes:
        - name: inicializacao
          configMap:
            name: inicializacao-postgres
            defaultMode: 0550
  volumeClaimTemplates:
    - metadata:
        name: dados
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    componente: rabbitmq
spec:
  selector:
    app: rabbitmq
  ports:
    - {name: amqp, port: 5672, targetPort: 5672}
    - {name: gerenciamento, port: 15672, targetPort: 15672}
    - {name: metricas, port: 15692, targetPort: 15692}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
        componente: dados
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          command: ["sh", "-c"]
          args: ["rabbitmq-plugins enable --offline rabbitmq_prometheus && rabbitmq-server"]
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef: {name: segredos-plataforma, key: RABBITMQ_USUARIO}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef: {name: segredos-plataforma, key: RABBITMQ_SENHA}
          ports:
            - {containerPort: 5672, name: amqp}
            - {containerPort: 15672, name: gerenciamento}
            - {containerPort: 15692, name: metricas}
          volumeMounts:
            - {name: dados, mountPath: /var/lib/rabbitmq}
          readinessProbe:
            exec: {command: ["rabbitmq-diagnostics", "-q", "ping"]}
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec: {command: ["rabbitmq-diagnostics", "-q", "ping"]}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
  volumeClaimTemplates:
    - metadata: {name: dados}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: {storage: 2Gi}
