apiVersion: v1
kind: Service
metadata: {name: gateway, labels: {componente: gateway}}
spec:
  type: LoadBalancer
  selector: {app: gateway}
  ports: [{name: http, port: 80, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway}
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector: {matchLabels: {app: gateway}}
  template:
    metadata:
      labels: {app: gateway, componente: aplicacao}
      annotations: {prometheus.io/scrape: "true", prometheus.io/path: "/metricas/", prometheus.io/port: "8000"}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: gateway
          image: ghcr.io/seu-usuario/pedidos-veloz-gateway:latest
          ports: [{containerPort: 8000, name: http}]
          envFrom: [{configMapRef: {name: configuracao-aplicacao}}]
          readinessProbe: {httpGet: {path: /pronto, port: http}, periodSeconds: 5, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /saude, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 256Mi}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts: [{name: temporario, mountPath: /tmp}]
      volumes: [{name: temporario, emptyDir: {sizeLimit: 64Mi}}]
---
apiVersion: v1
kind: Service
metadata: {name: pedidos, labels: {componente: pedidos}}
spec: {selector: {app: pedidos}, ports: [{name: http, port: 8001, targetPort: 8001}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: pedidos}
spec:
  replicas: 2
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app: pedidos}}
  template:
    metadata:
      labels: {app: pedidos, componente: aplicacao}
      annotations: {prometheus.io/scrape: "true", prometheus.io/path: "/metricas/", prometheus.io/port: "8001"}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: pedidos
          image: ghcr.io/seu-usuario/pedidos-veloz-pedidos:latest
          ports: [{containerPort: 8001, name: http}]
          envFrom: [{configMapRef: {name: configuracao-aplicacao}}]
          env:
            - {name: BANCO_URL, valueFrom: {secretKeyRef: {name: segredos-plataforma, key: BANCO_PEDIDOS_URL}}}
            - {name: RABBITMQ_URL, valueFrom: {secretKeyRef: {name: segredos-plataforma, key: RABBITMQ_URL}}}
