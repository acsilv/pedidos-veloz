apiVersion: v1
kind: Service
metadata: {name: otel-collector, labels: {componente: observabilidade}}
spec:
  selector: {app: otel-collector}
  ports: [{name: otlp-grpc, port: 4317, targetPort: 4317}, {name: otlp-http, port: 4318, targetPort: 4318}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: otel-collector}
spec:
  replicas: 1
  selector: {matchLabels: {app: otel-collector}}
  template:
    metadata: {labels: {app: otel-collector, componente: observabilidade}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.133.0
          args: ["--config=/etc/otel/config.yaml"]
          ports: [{containerPort: 4317, name: otlp-grpc}, {containerPort: 4318, name: otlp-http}]
          volumeMounts: [{name: configuracao, mountPath: /etc/otel/config.yaml, subPath: config.yaml, readOnly: true}]
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 250m, memory: 256Mi}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
      volumes: [{name: configuracao, configMap: {name: configuracao-otel}}]
