          livenessProbe: {httpGet: {path: /saude, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
          resources: {requests: {cpu: 100m, memory: 160Mi}, limits: {cpu: 500m, memory: 320Mi}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts: [{name: temporario, mountPath: /tmp}]
      volumes: [{name: temporario, emptyDir: {sizeLimit: 64Mi}}]
